name: Check scaffold
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/test_source_archive.py
      - run: pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium webkit firefox
      - run: python tests/browser_smoke.py
      # WebKit is Safari's engine; testers on Macs default to Safari.
      - run: python tests/browser_smoke.py --engine webkit
      - run: python tests/browser_smoke.py --engine firefox
  macos:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: swift --version
      - run: ./script/sync_shared.sh --check
      - run: swift test
      - run: ./script/build_and_run.sh --build-only
      # GUI launch/visual checks and Developer ID signing are intentionally separate.
