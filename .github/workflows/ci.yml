name: Check scaffold
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_smoke.py
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: ./script/sync_shared.sh --check
      - run: swift test
      - run: ./script/build_and_run.sh --build-only
      # GUI launch/visual checks and Developer ID signing are intentionally separate.
